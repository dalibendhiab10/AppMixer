name: Release

# Every push to main builds a .pkg, bumps the version from the commit messages
# (conventional commits) and publishes a GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            NEXT="1.0.0"
            RANGE="HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
            SUBJECTS="$(git log "$RANGE" --pretty=format:%s)"
            BODIES="$(git log "$RANGE" --pretty=format:%b)"
            if echo "$SUBJECTS" | grep -Eq '^[a-zA-Z]+(\(.+\))?!:' || echo "$BODIES" | grep -q 'BREAKING CHANGE'; then
              NEXT="$((MAJOR + 1)).0.0"
            elif echo "$SUBJECTS" | grep -Eq '^feat(\(.+\))?:'; then
              NEXT="$MAJOR.$((MINOR + 1)).0"
            else
              NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "## What's changed"
            git log "$RANGE" --pretty='- %s (%h)'
            echo
            echo "**Installation:** download \`AppMixer-$NEXT.pkg\` below and open it."
          } > "$RUNNER_TEMP/notes.md"

      - name: Build package
        run: scripts/make-pkg.sh "${{ steps.version.outputs.version }}"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "build/AppMixer-${{ steps.version.outputs.version }}.pkg" \
            --title "AppMixer $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
